<!doctype html>
<html lang="en" >
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css">
      <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">


    <title>House PropPriceAI</title>
  </head>
  <body class="bg-dark text-light">
   <div class="container">
     <div class="row justify-content-center">
       <div class="col-md-8">
         <div class="card mt-5 w-100 h-100">
           <div class="card-header text-center">
             <h1>WELCOME TO PropPriceAI</h1>
           <div class="card-body">
             <form id="predictForm" method="post">
               <div class="mb-3 text-center">
                  <label><b>Select the location:</b></label>
                  <select class="form-control" id="location" name="location" required>
                     {% for location in locations %}
                       <option value="{{location}}">{{location}}</option>
                     {% endfor %}
                  </select>
               </div>

               <div class="mb-3 text-center">
                  <label><b>Enter BHK:</b></label>
                  <input type="text" class="form-control" id="bhk" name="bhk" placeholder="Enter BHK">
               </div>

               <div class="mb-3 text-center">
                  <label><b>Enter Number Of Bathrooms:</b></label>
                  <input type="text" class="form-control" id="bath" name="bath" placeholder="Enter Number Of Bathrooms">
               </div>

               <div class="mb-3 text-center">
                  <label><b>Enter Square Feet:</b></label>
                  <input type="text" class="form-control" id="sqft" name="sqft" placeholder="Enter Square Feet">
               </div>

               <div class="mb-3">
                 <button type="submit" class="btn btn-primary form-control">Predict Price</button>
               </div>
             </form>

             <div class="text-center">
               <h3><span id="prediction"></span></h3>
             </div>
           </div>
         </div>
       </div>
     </div>
   </div>

<script>
  document.getElementById("predictForm").addEventListener("submit", async function(event){
    event.preventDefault();

    let formData = new FormData(this);

    let response = await fetch("/predict", {
      method: "POST",
      body: formData
    });

    let result = await response.json();
    document.getElementById("prediction").innerText = result.predicted_price || result.error;
  });
</script>

</html>
